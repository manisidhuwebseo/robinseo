<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Google CDN migration and Googlebot access</title><desc id="d">A CDN edge cache connects to an origin server while verified Googlebot traffic is allowed through a firewall and cache warm-up reduces origin load.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7f2"/><stop offset="1" stop-color="#e1f6ea"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#06150e"/><stop offset="1" stop-color="#0b3b29"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="85" y="110" font-family="Arial" font-size="44" font-weight="700" fill="#0b3b29">CDN MIGRATION: KEEP CACHES WARM AND VERIFIED CRAWLERS ACCESSIBLE</text><rect x="95" y="220" width="380" height="440" rx="28" fill="#fff" stroke="#b7dfc7" stroke-width="4"/><text x="150" y="290" font-family="Arial" font-size="32" font-weight="700" fill="#10251c">Origin server</text><g fill="#0b3b29"><rect x="165" y="345" width="240" height="58" rx="12"/><rect x="165" y="425" width="240" height="58" rx="12"/><rect x="165" y="505" width="240" height="58" rx="12"/></g><g fill="#3ddc97"><circle cx="190" cy="374" r="9"/><circle cx="190" cy="454" r="9"/><circle cx="190" cy="534" r="9"/></g><text x="220" y="383" font-family="Arial" font-size="20" fill="#fff">HTML / assets</text><text x="220" y="463" font-family="Arial" font-size="20" fill="#fff">Response logs</text><text x="220" y="543" font-family="Arial" font-size="20" fill="#fff">Origin capacity</text><rect x="610" y="220" width="380" height="440" rx="28" fill="url(#g)"/><text x="700" y="290" font-family="Arial" font-size="32" font-weight="700" fill="#f4f7f2">CDN edge</text><g fill="#dff7e9"><rect x="675" y="345" width="250" height="70" rx="16"/><rect x="675" y="440" width="250" height="70" rx="16"/><rect x="675" y="535" width="250" height="70" rx="16"/></g><g font-family="Arial" font-size="22" font-weight="700" fill="#0b3b29"><text x="715" y="389">Cache miss</text><text x="715" y="484">Cache warm-up</text><text x="715" y="579">Cache hit</text></g><path d="M475 435h135" stroke="#3ddc97" stroke-width="12" stroke-linecap="round"/><path d="M585 405l35 30-35 30" fill="none" stroke="#3ddc97" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M990 435h135" stroke="#3ddc97" stroke-width="12" stroke-linecap="round"/><path d="M1100 405l35 30-35 30" fill="none" stroke="#3ddc97" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="1135" y="220" width="370" height="440" rx="28" fill="#fff" stroke="#b7dfc7" stroke-width="4"/><text x="1190" y="290" font-family="Arial" font-size="30" font-weight="700" fill="#10251c">Verified crawler</text><circle cx="1320" cy="420" r="88" fill="#dff7e9"/><path d="M1320 355l55 20v48c0 42-26 68-55 86-29-18-55-44-55-86v-48z" fill="#0b3b29"/><path d="M1292 422l20 20 40-46" fill="none" stroke="#3ddc97" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="1190" y="560" font-family="Arial" font-size="22" fill="#0b3b29">Allow verified bots</text><text x="1190" y="598" font-family="Arial" font-size="22" fill="#0b3b29">Avoid CAPTCHA blocks</text><rect x="95" y="720" width="1410" height="110" rx="24" fill="url(#g)"/><text x="155" y="785" font-family="Arial" font-size="28" font-weight="700" fill="#f4f7f2">Pre-warm priority URLs</text><text x="650" y="785" font-family="Arial" font-size="28" font-weight="700" fill="#3ddc97">Verify Googlebot</text><text x="1120" y="785" font-family="Arial" font-size="28" font-weight="700" fill="#f4f7f2">Monitor origin load</text></svg>