<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Allowing verified Google-Agent traffic</title><desc>Website security flow verifies Google-Agent by user agent, source IP and optional Web Bot Auth before allowing a user-requested action.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06150e"/><stop offset="1" stop-color="#0b3b29"/></linearGradient><linearGradient id="m"><stop stop-color="#3ddc97"/><stop offset="1" stop-color="#b5f4d5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#001b10" flood-opacity=".17"/></filter></defs><rect width="1600" height="900" fill="#f4f7f2"/><rect width="1600" height="200" fill="url(#b)"/><text x="82" y="80" fill="#a5f1ce" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">ROBIN SEO • TECHNICAL SEARCH NEWS</text><text x="82" y="148" fill="#fff" font-family="Arial" font-size="48" font-weight="800">GOOGLE-AGENT ACCESS</text><g filter="url(#s)"><rect x="75" y="275" width="340" height="425" rx="28" fill="#fff"/><circle cx="245" cy="365" r="70" fill="#eaf5ee"/><path d="M205 365h80M245 325v80" stroke="#0b3b29" stroke-width="12" stroke-linecap="round"/><text x="245" y="485" text-anchor="middle" fill="#0b3b29" font-family="Arial" font-size="28" font-weight="800">REQUEST</text><text x="245" y="530" text-anchor="middle" fill="#49675a" font-family="Arial" font-size="20">Google-Agent</text><text x="245" y="565" text-anchor="middle" fill="#49675a" font-family="Arial" font-size="18">User-triggered task</text><rect x="135" y="615" width="220" height="50" rx="25" fill="#eaf5ee"/><text x="245" y="648" text-anchor="middle" fill="#0b3b29" font-family="Arial" font-size="17" font-weight="700">HTTPS REQUEST</text></g><path d="M425 485h100" stroke="#3ddc97" stroke-width="12" stroke-linecap="round"/><path d="M500 463l25 22-25 22" fill="none" stroke="#0b3b29" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="545" y="240" width="520" height="490" rx="30" fill="#fff"/><text x="805" y="310" text-anchor="middle" fill="#0b3b29" font-family="Arial" font-size="28" font-weight="800">VERIFY BEFORE ALLOWING</text><g transform="translate(600 355)"><rect width="410" height="85" rx="18" fill="#eef7f1"/><circle cx="48" cy="42" r="25" fill="url(#m)"/><path d="M36 42l9 9 17-21" stroke="#0b3b29" stroke-width="5" fill="none" stroke-linecap="round"/><text x="92" y="36" fill="#0b3b29" font-family="Arial" font-size="20" font-weight="700">User-Agent</text><text x="92" y="64" fill="#49675a" font-family="Arial" font-size="17">Contains Google-Agent</text></g><g transform="translate(600 460)"><rect width="410" height="85" rx="18" fill="#eef7f1"/><circle cx="48" cy="42" r="25" fill="url(#m)"/><path d="M36 42l9 9 17-21" stroke="#0b3b29" stroke-width="5" fill="none" stroke-linecap="round"/><text x="92" y="36" fill="#0b3b29" font-family="Arial" font-size="20" font-weight="700">Source IP</text><text x="92" y="64" fill="#49675a" font-family="Arial" font-size="17">Matches published ranges</text></g><g transform="translate(600 565)"><rect width="410" height="85" rx="18" fill="#eef7f1"/><circle cx="48" cy="42" r="25" fill="url(#m)"/><path d="M36 42l9 9 17-21" stroke="#0b3b29" stroke-width="5" fill="none" stroke-linecap="round"/><text x="92" y="36" fill="#0b3b29" font-family="Arial" font-size="20" font-weight="700">Web Bot Auth</text><text x="92" y="64" fill="#49675a" font-family="Arial" font-size="17">Validate signature when present</text></g></g><path d="M1075 485h100" stroke="#3ddc97" stroke-width="12" stroke-linecap="round"/><path d="M1150 463l25 22-25 22" fill="none" stroke="#0b3b29" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#s)"><rect x="1190" y="275" width="335" height="425" rx="28" fill="#fff"/><path d="M1357 345l82 32v62c0 76-42 116-82 140-40-24-82-64-82-140v-62z" fill="#eaf5ee" stroke="#0b3b29" stroke-width="7"/><path d="M1320 440l25 26 52-62" stroke="#0b3b29" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1357" y="620" text-anchor="middle" fill="#0b3b29" font-family="Arial" font-size="25" font-weight="800">SCOPED ACCESS</text><text x="1357" y="657" text-anchor="middle" fill="#49675a" font-family="Arial" font-size="18">Site actions • APIs • forms</text></g><text x="82" y="820" fill="#49675a" font-family="Arial" font-size="21">Verified requests can be allowed without weakening security for unknown traffic.</text></svg>