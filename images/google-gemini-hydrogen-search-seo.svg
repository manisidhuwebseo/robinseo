<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI-powered Google Search and connected website results</title>
<desc id="desc">An abstract intelligent search interface connects a central search field to related topic clusters, website result cards, image previews and a comparison table in Robin SEO's forest-green and mint palette.</desc>
