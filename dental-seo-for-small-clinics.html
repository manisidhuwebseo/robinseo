.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{background:var(--bone);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;transition:transform .3s,box-shadow .3s}
.tile:hover{transform:translateY(-6px);box-shadow:0 20px 44px #0b3b2918}
.tile b{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 12px;border-radius:15px;background:var(--forest2);color:var(--mint);font:800 20px var(--display)}
.tile span{font-weight:600;font-size:15px}

/* ===== services (dark bento) ===== */
.services{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.services:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,#14684a55,transparent 40%)}
.services .container{position:relative}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:52px}
.svc{background:linear-gradient(160deg,#0f2b1f,#0a1c14);border:1px solid #ffffff14;border-radius:22px;padding:30px;transition:transform .3s,border-color .3s}
.svc:hover{transform:translateY(-6px);border-color:#3ddc9766}
.svc.feat{background:linear-gradient(135deg,#14684a,#0b3b29)}
.svc:nth-child(1),.svc:nth-child(4),.svc:nth-child(6){grid-column:span 2}
.svc-n{display:block;font:800 14px var(--display);color:var(--mint);margin-bottom:34px;letter-spacing:.08em}
.svc h3{font-size:23px;font-weight:800;margin-bottom:10px}
.svc p{color:#b5cbbf;font-size:15.5px}

/* ===== long-tail + cities ===== */
.head-c{text-align:center;margin-bottom:50px}
.head-c .lead{margin:0 auto}
.lt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.lt{background:var(--bone);border:1px solid var(--line);border-radius:22px;padding:28px}
.lt h3{font-size:20px;font-weight:800;margin-bottom:18px}
.kws{display:flex;flex-wrap:wrap;gap:9px}
.kw{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--forest2)}
.cities{background:var(--bone)}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.city{background:#fff;border:1px solid var(--line);border-top:4px solid var(--mint);border-radius:20px;padding:26px;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.city:hover{transform:translateY(-6px);box-shadow:0 22px 46px #0b3b2918}
.city h3{font-size:21px;font-weight:800;margin-bottom:12px}
.city-n{font-size:14px;color:var(--muted);margin-bottom:14px}
.city-n b{color:var(--text)}
.city-k{list-style:none;display:grid;gap:8px;margin-bottom:20px}
.city-k li{font-size:14px;padding-left:22px;position:relative;color:var(--forest2);font-weight:500}
.city-k li:before{content:"";position:absolute;left:0;top:9px;width:10px;height:10px;border-radius:50%;background:var(--mint)}
.city-cta{margin-top:auto;font-weight:700;font-size:14px;color:var(--forest2);display:inline-flex;gap:8px;align-items:center;min-height:44px}
.city-cta span{transition:transform .25s}
.city-cta:hover span{transform:translateX(5px)}
.city-more{text-align:center;margin-top:36px;color:var(--muted)}
.city-more a{color:var(--forest2);font-weight:700;border-bottom:2px solid var(--mint)}

/* ===== ranking / compare / cost / lists ===== */
.byline{margin-top:22px;font-size:14px;color:#8fb0a0}
.byline a{color:var(--mint2);border-bottom:1px solid #3ddc9766}
.rk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.rk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
.rk h3{font-size:21px;font-weight:800;margin-bottom:10px}
.rk p{color:var(--muted)}
.prose{max-width:820px;margin:34px auto 0;color:var(--muted)}
.prose p+p{margin-top:14px}
.prose strong{color:var(--text)}
.direct{max-width:820px;font-size:18px;color:var(--muted)}
.ticks{list-style:none;display:grid;gap:12px;margin:24px 0}
.ticks li{position:relative;padding-left:34px;color:var(--text)}
.ticks li:before{content:"✓";position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:50px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px}
.box h3{font-size:22px;font-weight:800}
.tbl{overflow-x:auto;margin-top:36px;border:1px solid var(--line);border-radius:20px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:620px}
caption{text-align:left;padding:18px 22px;font-weight:700;color:var(--muted);font-size:14px}
th,td{padding:16px 22px;text-align:left;border-top:1px solid var(--line);font-size:15px;vertical-align:top}
thead th{background:var(--forest2);color:#fff;font:700 15px var(--display);border-top:0}
tbody th{font-weight:700;color:var(--text);background:var(--bone)}
.note{max-width:820px;margin:26px auto 0;color:var(--muted)}

/* ===== guide (flat article) ===== */
.guide{max-width:820px}
.guide h2{margin-bottom:18px}
.guide h3{font-size:24px;font-weight:800;margin:40px 0 12px}
.guide p{color:var(--muted);margin-bottom:14px;font-size:17px}
.guide ul,.guide ol{margin:6px 0 20px 22px;color:var(--muted);font-size:17px}
.guide li{margin:8px 0;padding-left:4px}
.guide strong{color:var(--text)}

/* ===== why (numbered rows) ===== */
.why-wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:start}
.sticky{position:sticky;top:120px}
.why-list{display:grid;gap:0}
.why{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:26px 0;border-top:1px solid var(--line)}
.why:last-child{border-bottom:1px solid var(--line)}
.why b{font:800 34px var(--display);color:var(--mint);-webkit-text-stroke:0}
.why h3{font-size:22px;font-weight:800;margin-bottom:6px}
.why p{color:var(--muted)}

/* ===== stats band ===== */
.band{background:linear-gradient(110deg,var(--mint),#7fe8b9);color:var(--ink);padding:62px 0}
.band-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center}
.band b{display:block;font:800 clamp(34px,4vw,52px) var(--display);letter-spacing:-.03em}
.band span{font-weight:600;font-size:15px}

/* ===== process (timeline) ===== */
.process{background:var(--bone)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:56px;position:relative;counter-reset:s}
.steps:before{content:"";position:absolute;top:27px;left:8%;right:8%;height:2px;background:repeating-linear-gradient(90deg,var(--mint) 0 10px,transparent 10px 18px)}
.step{position:relative;text-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:56px 26px 30px;margin-top:27px}
.step-dot{position:absolute;top:-27px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--forest2);color:var(--mint);display:grid;place-items:center;font:800 22px var(--display);box-shadow:0 0 0 8px var(--bone)}
.step h3{font-size:22px;font-weight:800;margin-bottom:8px}
.step p{color:var(--muted)}

/* ===== specialties ===== */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:12px 20px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px;transition:all .25s}
.chip span{color:var(--mint);transition:transform .25s}
.chip:hover{border-color:var(--forest2);background:var(--forest2);color:#fff;transform:translateY(-3px)}
.chip:hover span{transform:translateX(4px)}

/* ===== FAQ ===== */
.faq{background:var(--bone)}
.faq-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px;align-items:start}
.qa-grid{display:grid;gap:14px}
.qa{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 26px;transition:border-color .3s,box-shadow .3s}
.qa:hover{border-color:var(--mint);box-shadow:0 14px 36px #0b3b2914}
.qa h3{font-size:18px;font-weight:800;margin-bottom:8px}
.qa p{color:var(--muted)}

/* ===== contact ===== */
.get-audit{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.get-audit:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 0%,#14684a66,transparent 45%)}
.audit-grid{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.get-audit p{color:#b5cbbf}
.get-audit p strong{color:#fff}
.cl{list-style:none;margin:26px 0;display:grid;gap:12px}
.cl li{color:#cfe0d6}
.cl a{color:var(--mint);font-weight:600}
.wa-card{background:#0b1f16;border:1px solid #ffffff1c;border-radius:26px;padding:36px;text-align:center}
.wa-card h3{font-size:26px;font-weight:800;margin-bottom:10px}
.num{display:block;font:800 30px var(--display);color:var(--mint);margin:14px 0 6px}
.badge{display:inline-block;background:#3ddc9722;color:var(--mint2);font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;margin-bottom:22px}

/* ===== final CTA ===== */
.final{background:linear-gradient(135deg,var(--forest),var(--ink));color:#fff;text-align:center;padding:96px 0}
.final h2{font-size:clamp(30px,4.2vw,52px);font-weight:800;margin-bottom:16px}
.final p{color:#b5cbbf;max-width:640px;margin:0 auto 30px}

/* content is always visible to crawlers; animation only moves it */
.reveal.visible{animation:lift .8s cubic-bezier(.2,.7,.2,1)}
@keyframes lift{from{transform:translateY(26px)}to{transform:none}}
.d-1{animation-delay:.1s}.d-2{animation-delay:.2s}
.in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.in.d1{animation-delay:.1s}.in.d2{animation-delay:.25s}.in.d3{animation-delay:.4s}.in.d4{animation-delay:.55s}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}

/* ===== responsive / mobile ===== */
.btn,summary,nav a,.menu-toggle{min-height:44px}
.menu-toggle{min-width:44px}
.intro-grid>*,.what-grid>*,.why-wrap>*,.faq-wrap>*,.audit-grid>*{min-width:0}
@media(max-width:1000px){
  .intro-grid,.what-grid,.why-wrap,.faq-wrap,.audit-grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .sticky{position:static}
  .lt-grid,.city-grid{grid-template-columns:1fr 1fr}
  .rk-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr;gap:30px}
  .bento{grid-template-columns:1fr 1fr}
  .svc:nth-child(6){grid-column:auto}
  .band-grid{grid-template-columns:1fr 1fr}
  .f-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .menu-toggle{display:block}
  nav{display:none;position:absolute;top:78px;left:0;width:100%;background:var(--ink);padding:22px 5%;border-bottom:1px solid #ffffff14;max-height:calc(100vh - 78px);overflow-y:auto}
  nav.open{display:block}
  nav ul{flex-direction:column;align-items:flex-start;gap:18px}
  nav .nav-cta{display:block}
  nav .nav-cta a{display:inline-flex;align-items:center;background:var(--mint);color:var(--ink);font-weight:700;padding:12px 20px;border-radius:99px}
  .dropdown-menu{position:static;display:block;width:100%;max-height:200px;margin-top:10px}
  .navbar>.btn{display:none}
  .steps{grid-template-columns:1fr;gap:44px}
  .steps:before{display:none}
}
@media(max-width:600px){
  .section{padding:68px 0}
  .intro{padding:48px 0 64px}
  .intro h1{font-size:clamp(28px,8.2vw,40px)}
  .intro p.sub{font-size:16px}
  .intro-actions{flex-direction:column;align-items:stretch}
  .intro-actions .btn{width:100%}
  .dash{padding:16px}
  .dash-grid{grid-template-columns:1fr 1fr;gap:10px}
  .metric b{font-size:17px}
  .lt-grid,.city-grid{grid-template-columns:1fr}
  .bento{grid-template-columns:1fr}
  .svc:nth-child(n){grid-column:auto}
  .tiles{grid-template-columns:1fr 1fr;gap:12px}
  .why{grid-template-columns:52px 1fr}
  .why b{font-size:26px}
  .band-grid{gap:18px}
  .f-grid{grid-template-columns:1fr}
  .faq-list summary{font-size:16px}
  .wa-card{padding:26px 20px}
  .num{font-size:24px}
  .wa{padding:12px 18px;font-size:13px;right:16px;bottom:16px}
}
@media(prefers-reduced-motion:reduce){.reveal,.reveal.visible,.in{transform:none;animation:none}.bar i{transition:none;width:var(--w)}.spark path.line{stroke-dashoffset:0;transition:none}}

/* ================= PAGE VARIANTS ================= */
/* ---- light hero theme ---- */
.intro.light{background:linear-gradient(180deg,#e9f9f0 0%,#fff 100%);color:var(--text)}
.intro.light:before{background:radial-gradient(circle at 88% 10%,#b8efd0aa,transparent 46%),radial-gradient(circle at 0% 100%,#d7f5e4,transparent 50%)}
.intro.light:after{opacity:.4;background-image:linear-gradient(#0b3b2912 1px,transparent 1px),linear-gradient(90deg,#0b3b2912 1px,transparent 1px)}
.intro.light .crumb{color:var(--muted)}.intro.light .crumb a:hover{color:var(--forest2)}.intro.light .crumb span{color:var(--text)}
.intro.light .kicker{background:#d3f2e0;color:var(--forest2)}
.intro.light h1{color:var(--ink)}
.intro.light h1 em{color:var(--forest2);background:linear-gradient(transparent 62%,#3ddc9766 62%)}
.intro.light p.sub{color:var(--muted)}.intro.light p.sub strong{color:var(--text)}
.intro.light .trust{color:var(--muted)}.intro.light .trust span:before{color:var(--forest2)}
.intro.light .byline{color:var(--muted)}.intro.light .byline a{color:var(--forest2);border-color:#3ddc97}
.intro.light .btn-ghost{border-color:var(--forest2);color:var(--forest2)}.intro.light .btn-ghost:hover{background:#d3f2e0}
.disc{font-size:12px;text-align:center;margin-top:12px;color:#6f877a}
.intro.light .disc{color:var(--muted)}

/* ---- shared motion ---- */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #3ddc9788}70%{box-shadow:0 0 0 14px #3ddc9700}100%{box-shadow:0 0 0 0 #3ddc9700}}
@keyframes popin{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.btn-mint{position:relative;overflow:hidden}
.btn-mint:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
.float{animation:floaty 5s ease-in-out infinite}
.float.d2{animation-delay:-1.6s}.float.d3{animation-delay:-3.1s}

/* ---- hero visual 1: consultation journey (plastic surgery) ---- */
.jr{background:#0b1f16;border:1px solid #ffffff1c;border-radius:22px;padding:24px;box-shadow:0 40px 90px #0009}
.jr h2{font-size:17px;font-weight:700;margin-bottom:16px;font-family:var(--display)}
.jr-q{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:99px;padding:11px 16px;font-size:14px;color:#cfe0d6;margin-bottom:16px}
.jr-q:after{content:"|";color:var(--mint);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.jr-step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:13px 14px;border-radius:15px;background:#ffffff08;border:1px solid #ffffff12;margin-bottom:10px;animation:jrglow 8s infinite}
.jr-step:nth-of-type(2){animation-delay:2s}.jr-step:nth-of-type(3){animation-delay:4s}.jr-step:nth-of-type(4){animation-delay:6s}
@keyframes jrglow{0%,22%{border-color:var(--mint);background:#3ddc9718;transform:translateX(6px)}28%,100%{border-color:#ffffff12;background:#ffffff08;transform:none}}
.jr-n{width:44px;height:44px;border-radius:13px;background:var(--forest2);color:var(--mint);display:grid;place-items:center;font:800 18px var(--display)}
.jr-step b{display:block;font-size:15px}.jr-step small{color:#8fb0a0;font-size:12.5px}
.jr-bar{height:6px;border-radius:9px;background:#ffffff14;margin-top:7px;overflow:hidden}
.jr-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--mint2));border-radius:9px;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.go .jr-bar i{width:var(--w)}

/* ---- hero visual 2: booking card (primary care) ---- */
.bk{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 70px #0b3b2926}
.bk-top{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.bk-av{width:54px;height:54px;border-radius:16px;background:var(--forest2);color:var(--mint);display:grid;place-items:center;font:800 26px var(--display)}
.bk-top b{display:block;font:800 18px var(--display)}
.bk-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--forest2);background:#e3f4ea;padding:5px 12px;border-radius:99px;margin-top:4px}
.bk-badge i{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:pulse 2s infinite}
.bk-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.bk-chips span{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--bone)}
.bk-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.bk-days span{text-align:center;padding:9px 0;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700}
.bk-days span.on{background:var(--forest2);color:#fff;border-color:var(--forest2)}
.bk-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.bk-slots span{opacity:0;text-align:center;padding:10px 0;border-radius:12px;background:#e3f4ea;color:var(--forest2);font-weight:700;font-size:13.5px;animation:popin .5s forwards}
.bk-slots span:nth-child(1){animation-delay:.4s}.bk-slots span:nth-child(2){animation-delay:.6s}.bk-slots span:nth-child(3){animation-delay:.8s}.bk-slots span:nth-child(4){animation-delay:1s}.bk-slots span:nth-child(5){animation-delay:1.2s}.bk-slots span:nth-child(6){animation-delay:1.4s}
.bk-btn{display:block;text-align:center;padding:15px;border-radius:14px;background:var(--mint);color:var(--ink);font-weight:800;animation:pulse 2.4s infinite}
.bk-float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 18px 40px #0b3b2926}
.bk-float.a{left:26px;top:-20px}.bk-float.b{right:-16px;top:150px}

/* ---- hero visual 3: eye scanner (ophthalmology) ---- */
.eye{position:relative;height:430px;display:grid;place-items:center}
.eye svg{width:100%;max-width:470px;overflow:visible}
.ring{fill:none;stroke:#3ddc97;stroke-width:1.5;opacity:0;transform-origin:200px 150px;animation:ringp 5s ease-out infinite}
.ring.r2{animation-delay:1.6s}.ring.r3{animation-delay:3.2s}
@keyframes ringp{0%{opacity:.7;transform:scale(.55)}100%{opacity:0;transform:scale(1.5)}}
.iris-g{animation:scan 7s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(0)}25%{transform:translateX(-22px)}60%{transform:translateX(22px)}}
.lid{animation:blinkeye 6s infinite;transform-origin:200px 150px}
@keyframes blinkeye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.eye-chip{position:absolute;background:#0b1f16;border:1px solid #3ddc9755;color:#dff6e8;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:0 14px 34px #0008}
.eye-chip:before{content:"⌕ ";color:var(--mint)}
.eye-chip.a{left:0;top:40px}.eye-chip.b{right:0;top:120px}.eye-chip.c{left:20px;bottom:50px}

/* ---- hero visual 4: calm (mental health) ---- */
.calm{position:relative;height:440px;display:grid;place-items:center}
.br{position:absolute;border-radius:50%;animation:breathe 8s ease-in-out infinite}
.br.b1{width:340px;height:340px;background:radial-gradient(circle,#b8efd055,#b8efd011);animation-delay:0s}
.br.b2{width:250px;height:250px;background:radial-gradient(circle,#8fe3b866,#8fe3b822);animation-delay:.4s}
.br.b3{width:160px;height:160px;background:radial-gradient(circle,#3ddc97aa,#3ddc9744);animation-delay:.8s}
@keyframes breathe{0%,100%{transform:scale(.86)}50%{transform:scale(1.1)}}
.calm-txt{position:relative;font:700 20px var(--display);color:var(--forest2);text-align:center}
.calm-txt small{display:block;font:500 13px var(--body);color:var(--muted);margin-top:4px}
.calm-card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:700;color:var(--text);box-shadow:0 18px 40px #0b3b2922;display:flex;align-items:center;gap:10px}

.us-grid{stroke:#3ddc97;stroke-opacity:.08}
.us-line{fill:none;stroke:#3ddc97;stroke-opacity:.55;stroke-width:1.3;stroke-dasharray:4 6;animation:usflow 2.2s linear infinite}
@keyframes usflow{to{stroke-dashoffset:-20}}
.us-dot{fill:#3ddc97;transform-box:fill-box;transform-origin:center}
.us-halo{fill:#3ddc97;opacity:.35;transform-box:fill-box;transform-origin:center;animation:ushalo 3s ease-out infinite;animation-delay:var(--d)}
@keyframes ushalo{0%{transform:scale(.6);opacity:.55}100%{transform:scale(3.2);opacity:0}}
.us-hub{fill:#a8f0cc;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s infinite}
.us text{font:600 10.5px var(--body);fill:#cfe0d6}
.us-chip{position:absolute;left:0;top:8px;background:#0b1f16;border:1px solid #3ddc9755;color:#dff6e8;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700;box-shadow:0 14px 34px #0008}
.us-chip.b{left:0;right:auto;top:auto;bottom:30px}
.us .disc{position:absolute;left:0;right:0;bottom:-6px;margin:0}
.spc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.spc{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;transition:transform .3s,box-shadow .3s,border-color .3s}
.spc:hover{transform:translateY(-6px);box-shadow:0 22px 46px #0b3b2918;border-color:var(--mint)}
.spc h3{font-size:19px;font-weight:800;margin-bottom:6px}
.spc p{color:var(--muted);font-size:15px;margin-bottom:14px;flex:1}
.spc span{font-weight:700;color:var(--forest2);font-size:14px;display:inline-flex;gap:8px;align-items:center}
.spc span i{font-style:normal;transition:transform .25s;color:var(--mint)}
.spc:hover span i{transform:translateX(5px)}
.pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.pcs a{background:var(--bone);border:1px solid var(--line);border-radius:20px;padding:24px;transition:transform .3s,box-shadow .3s}
.pcs a:hover{transform:translateY(-6px);box-shadow:0 20px 44px #0b3b2914}
.pcs small{color:var(--muted);font-weight:600}
.pcs b{display:block;font:800 34px var(--display);letter-spacing:-.03em;margin:6px 0}
.pcs span{color:var(--forest2);font-weight:700;font-size:14.5px}
@media(max-width:1000px){.spc-grid{grid-template-columns:1fr 1fr}.pcs{grid-template-columns:1fr 1fr}.us{height:400px}}
@media(max-width:600px){.spc-grid,.pcs{grid-template-columns:1fr}.us{height:330px}.us-chip{font-size:12px;padding:7px 12px}.us-chip.b{bottom:30px}}
@media(prefers-reduced-motion:reduce){.us-out{animation:none;stroke-dashoffset:0}.us-line,.us-halo,.us-hub{animation:none}}

/* ================= SMALL CLINIC PAGE ================= */
.sc{position:relative;height:430px;margin-bottom:26px}
.sc svg{width:100%;height:100%;display:block;border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 70px #0b3b2926}
.sc-pin{transform-box:fill-box;transform-origin:center bottom;animation:floaty 3.4s ease-in-out infinite}
.sc-arc{fill:none;stroke:#3ddc97;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:scarc 3.6s ease-out infinite}
.sc-arc.a2{animation-delay:1.2s}.sc-arc.a3{animation-delay:2.4s}
@keyframes scarc{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
.sc-star{fill:#f5b301;transform-box:fill-box;transform-origin:center;animation:scstar 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes scstar{0%,8%{transform:scale(.2)}20%{transform:scale(1.25)}28%,92%{transform:scale(1)}100%{transform:scale(.2)}}
.sc-door{transform-box:fill-box;transform-origin:left center;animation:scdoor 8s ease-in-out infinite}
@keyframes scdoor{0%,58%{transform:scaleX(1)}64%,82%{transform:scaleX(.3)}90%,100%{transform:scaleX(1)}}
.sc-person{transform-box:fill-box;transform-origin:center bottom;animation:scwalk 8s linear infinite;animation-delay:var(--d)}
